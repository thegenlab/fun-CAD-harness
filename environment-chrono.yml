# Physics environment for FunCAD-Harness: PyChrono plus the small set of
# packages the simulation runtime imports. Kept separate from the CAD
# environment because OCP and PyChrono ship independent native dependencies.
name: funcad-chrono
channels:
  - projectchrono/label/main
  - conda-forge
dependencies:
  - python=3.12.13
  # The build used for the paper's experiments (Linux and Windows builds share build number 677).
  - pychrono=10.0.0=*_677
  - numpy
  - scipy
  - pip=25.1.1
  - pip:
      - psutil==7.2.2
      - trimesh==4.9.0
      - typing_extensions==4.15.0
